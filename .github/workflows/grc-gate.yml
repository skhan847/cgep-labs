name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_WORKING_DIR: terraform/primitives/compliant-s3
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    services:
      moto:
        image: motoserver/moto:latest
        ports:
          - 4566:5000
        env:
          MOTO_IAM_LOAD_MANAGED_POLICIES: "true"
    steps:
      - uses: actions/checkout@v4

      # Real AWS login, turned off until AWS lifts the account block:
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Start Moto (stand-in for AWS)
        run: |
          for i in $(seq 60); do curl -s http://127.0.0.1:4566/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4566/moto-api/ >/dev/null && echo "Moto is up"
          cat > /tmp/moto_override.tf <<'TF'
          provider "aws" {
            region                      = "us-east-1"
            access_key                  = "test"
            secret_key                  = "test"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
            s3_use_path_style           = true
            endpoints {
              s3  = "http://127.0.0.1:4566"
              sts = "http://127.0.0.1:4566"
              iam = "http://127.0.0.1:4566"
              kms = "http://127.0.0.1:4566"
              sns = "http://127.0.0.1:4566"
            }
          }
          TF
          cp /tmp/moto_override.tf "$TF_WORKING_DIR/moto_override.tf"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Install tfsec
        run: |
          curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && chmod +x /usr/local/bin/tfsec

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -out=tfplan -input=false -no-color \
            -var="project_name=cgep-lab" -var="environment=dev" | tee plan.txt
          terraform show -json tfplan > plan.json

      - name: Conftest policy gate
        id: conftest
        continue-on-error: true
        run: |
          mkdir -p evidence/lab-4-3
          EXIT=0
          {
            echo "["
            FIRST=1
            for ns in compliance.sc28_aws compliance.ac3_aws compliance.cm6_aws ; do
              [[ $FIRST -eq 1 ]] && FIRST=0 || printf ","
              set +e
              OUT=$(conftest test --policy policies --namespace "$ns" --output=json "$TF_WORKING_DIR/plan.json")
              STATUS=$?
              set -e
              [[ $STATUS -eq 0 ]] || EXIT=1
              printf '%s' "$OUT"
            done
            echo
            echo "]"
          } > evidence/lab-4-3/conftest-results.json
          if [[ $EXIT -eq 0 ]]; then echo "conftest: PASS"; else echo "conftest: FAIL"; exit 1; fi

      - name: tfsec scan
        id: tfsec
        if: always()
        continue-on-error: true
        run: |
          tfsec "$TF_WORKING_DIR" --format sarif --out evidence/lab-4-3/tfsec.sarif || true
          tfsec "$TF_WORKING_DIR" --minimum-severity HIGH

      - name: Copy plan into evidence
        if: always()
        run: |
          cp "$TF_WORKING_DIR"/plan.json evidence/lab-4-3/plan.json
          cp "$TF_WORKING_DIR"/plan.txt  evidence/lab-4-3/plan.txt

      - name: Build evidence vault in Moto
        if: always()
        run: |
          if ! curl -s http://127.0.0.1:4566/ >/dev/null; then pip install -q "moto[server]"; MOTO_IAM_LOAD_MANAGED_POLICIES=true nohup python -m moto.server -p 4566 > moto.log 2>&1 & fi
          for i in $(seq 1 30); do curl -s http://127.0.0.1:4566/ >/dev/null && break; sleep 1; done
          echo "Moto is up"
          VAULT_DIR=$(dirname "$(find terraform -path '*evidence-vault*' -name main.tf -not -path '*/.terraform/*' | head -1)")
          echo "Vault code: $VAULT_DIR"
          if ! curl -s http://127.0.0.1:4566/ >/dev/null; then
            echo "Moto was down, log:"; cat moto.log || true
            nohup python -m moto.server -p 4566 > moto2.log 2>&1 &
          fi
          for i in $(seq 30); do curl -s http://127.0.0.1:4566/ >/dev/null && break; sleep 1; done
          cp /tmp/moto_override.tf "$VAULT_DIR/moto_override.tf"
          cd "$VAULT_DIR"
          export TF_VAR_project_name=cgep-lab TF_VAR_environment=dev
          terraform init -input=false
          terraform apply -auto-approve -input=false
          VAULT=$(aws --endpoint-url http://127.0.0.1:4566 s3api list-buckets \
            --query "Buckets[?contains(Name,'evidence-vault')].Name | [0]" --output text)
          echo "Vault bucket: $VAULT"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"

      - name: Bundle + sign + upload to vault
        id: sign
        if: always()
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p evidence/lab-4-4
          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          tar -czf "$BUNDLE" evidence/lab-4-3
          sha256sum "$BUNDLE" | awk '{print $1}' > "$BUNDLE.sha256"
          cosign sign-blob --yes --bundle "$BUNDLE.sig.bundle" "$BUNDLE"
          for f in "$BUNDLE" "$BUNDLE.sha256" "$BUNDLE.sig.bundle"; do
            aws s3 cp "$f" "s3://$VAULT/runs/$RUN_ID/$f" --checksum-algorithm SHA256
          aws s3api put-object --bucket "$VAULT" --key "runs/$RUN_ID/$f" --body "$f" --checksum-algorithm SHA256
          VERSION=$(aws s3api head-object --bucket "$VAULT" --key "runs/$RUN_ID/$BUNDLE" \
            --query VersionId --output text)
          cat > receipt.json <<JSON
          {"run_id":"$RUN_ID","commit":"$SHA","bundle":"$BUNDLE","sha256":"$(cat $BUNDLE.sha256)","vault":"$VAULT","version_id":"$VERSION","signed_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          aws s3api put-object --bucket "$VAULT" --key "runs/$RUN_ID/receipt.json" --body receipt.json --checksum-algorithm SHA256
          cp receipt.json evidence/lab-4-4/receipt.json
          cat receipt.json

      - name: Verify chain of custody
        if: always()
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: |
          bash scripts/verify-evidence.sh "${{ github.run_id }}" --vault "$VAULT" 2>&1 \
            | tee evidence/lab-4-4/verify.txt
          exit ${PIPESTATUS[0]}

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: |
            evidence/lab-4-3/
            evidence/lab-4-4/
          retention-days: 90

      - name: Enforce gate
        if: always()
        run: |
          test "${{ steps.conftest.outcome }}" = "success" \
            && test "${{ steps.tfsec.outcome }}" = "success"
